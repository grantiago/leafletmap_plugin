PLG_SYSTEM_LEAFLETMAP_VERSION="1.0.9"
PLG_SYSTEM_LEAFLETMAP_PLUGIN_DESC="Muestra un mapa de Leaflet en los artículos."
PLG_SYSTEM_LEAFLETMAP_DESCRIPTION_DESC="<h4>Plugin Leaflet</h4><p><code>archivo: .ini</code></p><h5>1.0.9 -- 2026-07-22</h5><p><em>uso:</em><code> {leafletmap lat=&quot;44.66&quot; lng=&quot;-116.23&quot; marker_title=&quot;grant house&quot;}</code><br><em>uso — hook:</em><code> {leafletmap lat=&quot;44.66&quot; lng=&quot;-116.23&quot; marker_title=&quot;grant house&quot;}</code>Ejemplo de sobrescrituras por shortcode:<br><code>{leafletmap lat=&quot;43.66&quot; lng=&quot;-116.23&quot; zoom=&quot;13&quot; width=&quot;100%&quot; height=&quot;360px&quot; align=&quot;align-center&quot; title_toggle=&quot;1&quot; zoom_wheel=&quot;0&quot; marker_title=&quot;My Spot&quot; marker_content=&quot;Grant&lt;br/&gt;Line 2&quot; marker_icon=&quot;blue-marker.png&quot; kml=&quot;/media/routes/river.kml&quot; geojson=&quot;/media/routes/river.geojson&quot; markers=&quot;43.66,-116.24,Home,Hello,blue-marker.png|43.67,-116.25,Camp,Overnight,red-marker.png&quot;}</code></p><p>El plugin de sistema LeafletMap soporta múltiples mapas en una sola página y en varios artículos. Renderiza KML y GeoJSON. Permite elegir entre mapas base de OpenStreetMap, ESRI y OpenTopoMap. Los archivos JS y CSS de Leaflet se cargan una sola vez en el encabezado cuando se necesitan. El script de inicialización del mapa se inserta en el contenido, lo que permite usar más de un mapa en una o varias entradas de una misma página (p. ej., diseño de blog o lista de categoría).</p><h4>Funciones</h4><ul><li>Mostrar un mapa Leaflet en artículos de Joomla.</li><li>Soporte para KML</li><li>Autoajuste de límites (fit bounds) para KML.</li><li>Soporte para GeoJSON</li><li>Varios mapas en una misma página 👍</li><li>Atribuciones correctas de los proveedores de mapas sin el prefijo de Leaflet</li>
<li>Control de mapa a pantalla completa</li><li>Íconos de marcadores personalizados</li><li>Abrir ventana de información al cargar</li><li>Conmutar rueda de zoom</li><li>Desplazamiento y zoom con dos dedos en móviles</li><li>Multilenguaje: en-GB, es-ES</li></ul>"

